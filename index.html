<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Title -->
    <title>Dilshan Narankotuwa | Full-Stack Developer</title>

    <!-- Description -->
    <meta
      name="description"
      content="Dilshan Narankotuwa — Full-Stack Developer. I build modern web apps with React, Node.js, and databases, and develop scientific automation tools in Python. Explore projects, skills, and contact info."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://personal-portfolio-zeta-coral.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/images/dilshan.jpeg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0B1220" />

    <!-- Open Graph (LinkedIn/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dilshan Narankotuwa" />
    <meta property="og:title" content="Dilshan Narankotuwa | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-Stack Developer building React + Node.js apps and Python automation tools. View projects, skills, and contact details."
    />
    <meta property="og:url" content="https://personal-portfolio-zeta-coral.vercel.app/" />

    <!-- IMPORTANT: create this image in /public/images/og-cover.png -->
    <meta
      property="og:image"
      content="https://personal-portfolio-zeta-coral.vercel.app/images/dilshan.jpeg"
    />
    <meta property="og:image:alt" content="Dilshan Narankotuwa portfolio preview" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dilshan Narankotuwa | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-Stack Developer building React + Node.js apps and Python automation tools. Explore my portfolio."
    />
    <meta
      name="twitter:image"
      content="https://personal-portfolio-zeta-coral.vercel.app/images/dilshan.jpeg"
    />

    <!-- Optional -->
    <meta
      name="keywords"
      content="Dilshan Narankotuwa, Full Stack Developer, React, Node.js, PostgreSQL, Python, Portfolio, Software Engineer"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
